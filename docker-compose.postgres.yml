# Variante con PostgreSQL (opcional): el esquema se valida en un segundo motor.
# No es el camino de la demo ni el de las pruebas; sirve para comprobar que la
# migracion de Flyway funciona tambien fuera de H2.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservationdb
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/reservationdb
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
    depends_on:
      postgres:
        condition: service_healthy
