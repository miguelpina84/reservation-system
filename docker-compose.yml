services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservationdb
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/reservationdb
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
    depends_on:
      postgres:
        condition: service_healthy
