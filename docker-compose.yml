# Stack por defecto: la aplicacion en Docker con H2 en memoria.
# No requiere ninguna base de datos externa ni imagen adicional.
#
#   DOCKERFILE=Dockerfile.offline APP_PORT=18080 docker compose up -d --build
#
services:
  app:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: reservation-system:ci
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Sin perfil de postgres => la app usa H2 en memoria (src/main/resources/application.yml).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Prueba de carga: docker compose --profile load up --build
  k6:
    image: grafana/k6:0.53.0
    profiles: ["load"]
    volumes:
      - ./performance:/scripts:ro
    environment:
      BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    command: run /scripts/k6-load.js
