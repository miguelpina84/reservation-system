# Perfil de pruebas: SIEMPRE H2 en memoria.
# Ningun test de la suite requiere Docker ni PostgreSQL: `mvn test` funciona en una
# maquina limpia. La validacion contra PostgreSQL se hace aparte, con el stack de Docker
# (ver docker-compose.yml y el job "Imagen Docker y smoke test" del CI).
spring:
  datasource:
    url: jdbc:h2:mem:reservationtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    users:
      - username: admin
        password: admin123
        roles: ADMIN,USER
      - username: user
        password: user123
        roles: USER
