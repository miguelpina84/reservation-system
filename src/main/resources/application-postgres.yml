# Perfil para PostgreSQL (docker compose / entorno real)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservationdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
