spring:
  application:
    name: reservation-system

  datasource:
    url: jdbc:h2:mem:reservationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info

app:
  security:
    users:
      - username: admin
        password: admin123
        roles: ADMIN,USER
      - username: user
        password: user123
        roles: USER

logging:
  level:
    org.springframework.security: INFO
