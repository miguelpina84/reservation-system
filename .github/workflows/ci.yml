name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build y tests (H2, sin Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, tests y cobertura
        # La suite inicial corre contra H2 en memoria (perfil "test"): no requiere
        # Docker ni PostgreSQL. El camino PostgreSQL se valida en el job de Docker.
        run: mvn -B verify

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  docker-image:
    name: Imagen Docker y smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reservation-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test en Docker con H2 (camino de la demo)
        run: |
          docker compose up -d app
          bash scripts/smoke-test.sh http://localhost:8080

      - name: Smoke test en Docker con PostgreSQL (verificacion opcional del esquema)
        run: |
          docker compose down -v
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d app
          bash scripts/smoke-test.sh http://localhost:8080

      - name: Logs de la aplicación
        if: failure()
        run: docker compose logs --no-color app postgres

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v
