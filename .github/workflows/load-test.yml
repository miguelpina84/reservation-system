name: Prueba de carga

on:
  workflow_dispatch:
  schedule:
    # De madrugada, cada madrugada del domingo
    - cron: '17 4 * * 0'

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    name: k6 contra el stack en Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar PostgreSQL y la aplicación
        run: |
          docker compose up -d --build postgres app
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then
              echo "Aplicacion lista"
              exit 0
            fi
            sleep 3
          done
          echo "La aplicacion no levanto a tiempo"
          docker compose logs --no-color
          exit 1

      - name: Ejecutar prueba de carga con k6
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/performance:/scripts:ro" \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6:0.53.0 run --quiet /scripts/k6-load.js

      - name: Publicar resumen de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: performance/summary.json
          retention-days: 7

      - name: Logs de la aplicación
        if: failure()
        run: docker compose logs --no-color app postgres

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v
